version: "3.8"

services:
  fastapi_app1:
    image: ghcr.io/aleksbasov/myimage:1  
    container_name: fastapi_app1
    restart: always
    environment:
      - ENV=production
    networks:
      - app_network

  fastapi_app2:
    image: ghcr.io/aleksbasov/myimage:1 
    container_name: fastapi_app2
    restart: always
    environment:
      - ENV=production
    networks:
      - app_network

  fastapi_app3:
    image: ghcr.io/aleksbasov/myimage:1  
    container_name: fastapi_app3
    restart: always
    environment:
      - ENV=production
    networks:
      - app_network

  nginx:
    image: nginx:latest
    container_name: my_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx-conf/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - fastapi_app1
      - fastapi_app2
      - fastapi_app3
    restart: always
    networks:
      - app_network

networks:
  app_network:
    driver: bridge